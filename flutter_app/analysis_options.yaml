include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_print
    - prefer_single_quotes

# The codebase is written with long lines (one-line widgets, test tables). 120 keeps them readable
# and makes the CI format gate (`dart format --set-exit-if-changed`) pass.
formatter:
  page_width: 120
