include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Flutter 3.47+ deprecates importing package:flutter/material.dart and cupertino.dart in favour of the
    # separate material_ui / cupertino_ui packages. That migration touches every file and is its own job; until
    # then these notices would fail the zero-issues `flutter analyze` gate on every file.
    deprecated_member_use: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - web/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_print
    - prefer_single_quotes

# The codebase is written with long lines (one-line widgets, test tables). 120 keeps them readable
# and makes the CI format gate (`dart format --set-exit-if-changed`) pass.
formatter:
  page_width: 120
