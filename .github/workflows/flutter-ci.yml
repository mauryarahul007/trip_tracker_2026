name: Flutter CI

on:
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches:
      - main
      - flutter
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-ci.yml'

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-test:
    name: Flutter Lint, Test & Build (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter & Dart diagnostic versions
        run: |
          flutter --version
          dart --version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter static analysis (Zero issues policy)
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test

      - name: Build Android Debug APK (Dev flavor)
        run: flutter build apk --debug --flavor dev -t lib/main.dart

      - name: Fixtures still match the web source (no drift)
        working-directory: .
        run: |
          node scripts/export-golden-fixtures.mjs
          git diff --exit-code -- docs/flutter-migration/fixtures flutter_app/lib/domain/logic

      - name: Dependency report (informational)
        run: flutter pub outdated || true

      - name: Release hardening files exist
        working-directory: .
        run: |
          test -x flutter_app/tool/release_version.sh
          test -x flutter_app/tool/check_release_signing.sh
          test -x flutter_app/tool/scan_binary_secrets.sh
          grep -q 'allowBackup="false"' flutter_app/android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' flutter_app/android/app/src/main/AndroidManifest.xml

