name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          # This app is served from the domain root on EC2, not a
          # /trip_tracker_2026/ subpath like the GitHub Pages build.
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Packages this same build as a live-update bundle for the iOS/Android
      # app shell (src/utils/liveUpdate.ts), so JS/CSS changes reach
      # installed apps without an App Store resubmission.
      - name: Package live-update bundle
        run: |
          ./scripts/package-update.sh \
            "${GITHUB_SHA::7}" \
            https://trip-tracker.blackmaroon.in/updates \
            update \
            dist

      - name: Install SSH key
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh-keyscan -T 10 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync dist/ to server
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes" \
            dist/ \
            "${EC2_USER}@${EC2_HOST}:/var/www/trip-tracker-2026/dist/"

      - name: Rsync update bundle to server
        # Nested inside dist/ (nginx's existing docroot) rather than a
        # sibling path, so no server/nginx config change is needed for
        # https://trip-tracker.blackmaroon.in/updates/latest.json to resolve.
        env:
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes" \
            update/ \
            "${EC2_USER}@${EC2_HOST}:/var/www/trip-tracker-2026/dist/updates/"
