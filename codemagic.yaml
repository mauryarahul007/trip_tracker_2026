workflows:
  android-release:
    name: Android Release Build (APK + AAB)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      groups:
        - trip_tracker_secrets
        - android_signing
      vars:
        VITE_BASE_PATH: "/"
      node: 22
      java: 21
    triggering:
      events: []
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync native version
        script: node scripts/sync-native-version.mjs
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build signed Android APK and App Bundle
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

  android-debug:
    name: Android Debug Build (Universal APK)
    max_build_duration: 20
    instance_type: linux_x2
    environment:
      groups:
        - trip_tracker_secrets
      vars:
        VITE_BASE_PATH: "/"
      node: 22
      java: 21
    triggering:
      events: []
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync native version
        script: node scripts/sync-native-version.mjs
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build Debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-release:
    name: iOS Release Build (App Store / Ad-Hoc IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_asc_api_key
    environment:
      groups:
        - trip_tracker_secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.triptracker.app
      vars:
        VITE_BASE_PATH: "/"
      node: 22
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync native version
        script: node scripts/sync-native-version.mjs
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build and sign IPA
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa

  ios-simulator:
    name: iOS Simulator Build (Unsigned .app)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - trip_tracker_secrets
      vars:
        VITE_BASE_PATH: "/"
      node: 22
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync native version
        script: node scripts/sync-native-version.mjs
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build Simulator App
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build/ios
    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app

  flutter-android-debug:
    name: Flutter Android Debug (Dev Flavor APK)
    max_build_duration: 25
    instance_type: linux_x2
    environment:
      groups:
        - trip_tracker_secrets
      flutter: stable
      java: 21
    triggering:
      events: []
    scripts:
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter packages get
      - name: Flutter analyze & test
        script: |
          cd flutter_app
          flutter analyze
          flutter test
      - name: Build Android Debug APK
        script: |
          cd flutter_app
          flutter build apk --debug --flavor dev -t lib/main.dart
    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/*.apk

  flutter-ios-debug:
    name: Flutter iOS Debug (Simulator .app + Unsigned Device)
    max_build_duration: 35
    instance_type: mac_mini_m2
    environment:
      groups:
        - trip_tracker_secrets
      flutter: stable
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter packages get
      - name: Flutter analyze & test
        script: |
          cd flutter_app
          flutter analyze
          flutter test
      - name: Build iOS Simulator App
        script: |
          cd flutter_app
          flutter build ios --simulator --debug --no-codesign -t lib/main.dart
      - name: Build Unsigned iOS Device App
        script: |
          cd flutter_app
          flutter build ios --debug --no-codesign -t lib/main.dart
      # TODO (Phase 12): Add App Store signing certificates, provisioning profiles, and TestFlight release scripts
    artifacts:
      - flutter_app/build/ios/iphonesimulator/*.app
      - flutter_app/build/ios/iphoneos/*.app

