workflows:
  android-release:
    name: Android Release Build (APK + AAB)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      groups:
        - trip_tracker_secrets
        - android_signing
      vars:
        VITE_BASE_PATH: "/"
      node: 22
      java: 21
    triggering:
      events: []
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync native version
        script: node scripts/sync-native-version.mjs
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build signed Android APK and App Bundle
        script: |
          cd android
          ./gradlew assembleRelease bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

  android-debug:
    name: Android Debug Build (Universal APK)
    max_build_duration: 20
    instance_type: linux_x2
    environment:
      groups:
        - trip_tracker_secrets
      vars:
        VITE_BASE_PATH: "/"
      node: 22
      java: 21
    triggering:
      events: []
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync native version
        script: node scripts/sync-native-version.mjs
      - name: Sync Capacitor Android
        script: npx cap sync android
      - name: Build Debug APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-release:
    name: iOS Release Build (App Store / Ad-Hoc IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_asc_api_key
    environment:
      groups:
        - trip_tracker_secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.triptracker.app
      vars:
        VITE_BASE_PATH: "/"
      node: 22
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync native version
        script: node scripts/sync-native-version.mjs
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build and sign IPA
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - ios/App/build/ios/ipa/*.ipa

  ios-simulator:
    name: iOS Simulator Build (Unsigned .app)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - trip_tracker_secrets
      vars:
        VITE_BASE_PATH: "/"
      node: 22
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Sync native version
        script: node scripts/sync-native-version.mjs
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Build Simulator App
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build/ios
    artifacts:
      - build/ios/Build/Products/Debug-iphonesimulator/*.app

  flutter-android-debug:
    name: Flutter Android Debug (Dev Flavor APK)
    max_build_duration: 25
    instance_type: linux_x2
    environment:
      groups:
        - trip_tracker_secrets
      flutter: stable
      java: 21
    triggering:
      events: []
    scripts:
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter packages get
      - name: Flutter analyze & test
        script: |
          cd flutter_app
          flutter analyze
          flutter test
      - name: Build Android Debug APK
        script: |
          cd flutter_app
          flutter build apk --debug --flavor dev -t lib/main.dart
    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/*.apk

  flutter-ios-debug:
    name: Flutter iOS Debug (Simulator .app + Unsigned Device)
    max_build_duration: 35
    instance_type: mac_mini_m2
    environment:
      groups:
        - trip_tracker_secrets
      flutter: stable
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: Get Flutter packages
        script: |
          cd flutter_app
          flutter packages get
      - name: Flutter analyze & test
        script: |
          cd flutter_app
          flutter analyze
          flutter test
      - name: Build iOS Simulator App
        script: |
          cd flutter_app
          flutter build ios --simulator --debug --no-codesign -t lib/main.dart
      - name: Build Unsigned iOS Device App
        script: |
          cd flutter_app
          flutter build ios --debug --no-codesign -t lib/main.dart
      # TODO (Phase 12): Add App Store signing certificates, provisioning profiles, and TestFlight release scripts
    artifacts:
      - flutter_app/build/ios/iphonesimulator/*.app
      - flutter_app/build/ios/iphoneos/*.app


  # ---------------------------------------------------------------------------
  # Phase 12.7: Flutter release pipelines. Tagged releases only (flutter-v*), never on push.
  # Required Codemagic secrets (nothing is stored in the repo):
  #   group flutter_release_env: PROD_ENV_JSON_B64 (base64 of env/prod.json: SUPABASE_*, GOOGLE_* ids)
  #   group flutter_android_signing: TT_KEYSTORE_PATH (file secret path), TT_KEYSTORE_PASSWORD,
  #                                  TT_KEY_ALIAS, TT_KEY_PASSWORD, GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
  #   iOS: App Store Connect API key integration `codemagic_asc_api_key`; automatic signing for
  #        com.triptracker.app. Firebase files must be present (see contract/PUSH_SETUP.md section 5).
  # Manual promotion steps: docs/flutter-migration/store/RELEASE_PIPELINE.md
  # ---------------------------------------------------------------------------
  flutter-android-release:
    name: Flutter Android Release (signed AAB to Play internal)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      groups:
        - flutter_release_env
        - flutter_android_signing
      flutter: stable
      java: 21
      node: 22
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'flutter-v*'
          include: true
    scripts:
      - name: Get packages
        script: cd flutter_app && flutter pub get
      - name: Quality gate (format, analyze, tests)
        script: |
          cd flutter_app
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test
      - name: Fixtures match the web source
        script: |
          node scripts/export-golden-fixtures.mjs
          git diff --exit-code -- docs/flutter-migration/fixtures flutter_app/lib/domain/logic
      - name: Write prod env (git-ignored file)
        script: echo "$PROD_ENV_JSON_B64" | base64 --decode > flutter_app/env/prod.json
      - name: Build signed App Bundle (obfuscated)
        script: |
          cd flutter_app
          flutter build appbundle --release --flavor prod -t lib/main.dart \
            --dart-define-from-file=env/prod.json \
            --obfuscate --split-debug-info=build/symbols \
            $(tool/release_version.sh)
      - name: Refuse a debug-signed or secret-bearing artifact
        script: |
          cd flutter_app
          aab=build/app/outputs/bundle/prodRelease/app-prod-release.aab
          tool/check_release_signing.sh "$aab"
          tool/scan_binary_secrets.sh "$aab"
    artifacts:
      - flutter_app/build/app/outputs/bundle/prodRelease/*.aab
      - flutter_app/build/symbols/**
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  flutter-ios-release:
    name: Flutter iOS Release (signed IPA to TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_asc_api_key
    environment:
      groups:
        - flutter_release_env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.triptracker.app
      flutter: stable
      xcode: latest
      node: 22
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'flutter-v*'
          include: true
    scripts:
      - name: Get packages
        script: cd flutter_app && flutter pub get
      - name: Quality gate (format, analyze, tests)
        script: |
          cd flutter_app
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test
      - name: Write prod env (git-ignored file)
        script: echo "$PROD_ENV_JSON_B64" | base64 --decode > flutter_app/env/prod.json
      - name: Install pods
        script: cd flutter_app/ios && pod install
      - name: Set up code signing
        script: xcode-project use-profiles --project flutter_app/ios/Runner.xcodeproj
      - name: Build signed IPA (obfuscated)
        script: |
          cd flutter_app
          flutter build ipa --release -t lib/main.dart \
            --dart-define-from-file=env/prod.json \
            --obfuscate --split-debug-info=build/symbols \
            --export-options-plist=/Users/builder/export_options.plist \
            $(tool/release_version.sh)
      - name: Refuse an artifact that carries secrets
        script: |
          cd flutter_app
          tool/scan_binary_secrets.sh build/ios/ipa/*.ipa
    artifacts:
      - flutter_app/build/ios/ipa/*.ipa
      - flutter_app/build/symbols/**
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
